services:
  podatnik:
    build: .
    container_name: podatnik
    restart: always
    env_file:
      - .env
    environment:
      - NODE_ENV=${NODE_ENV}
      - PORT=${PORT}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.podatnik.rule=Host(`${DOMAIN}`) || Host(`www.${DOMAIN}`)"
      - "traefik.http.routers.podatnik.entrypoints=websecure"
      - "traefik.http.routers.podatnik.tls.certresolver=le"
      - "traefik.http.services.podatnik.loadbalancer.server.port=${PORT}"
    networks:
      - web
    expose:
      - "${PORT}"

networks:
  web:
    external: true
